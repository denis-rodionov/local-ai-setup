# Pods cannot open the Colima gateway. This proxy runs on the VM network,
# where 192.168.5.2:11434 answers, and publishes that as a Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-bridge
  namespace: ai
data:
  proxy.py: |
    import socket
    import threading

    LISTEN = ("0.0.0.0", 11435)
    TARGET = ("192.168.5.2", 11434)

    def pipe(src, dst):
        try:
            while True:
                data = src.recv(65536)
                if not data:
                    break
                dst.sendall(data)
        except OSError:
            pass
        finally:
            try:
                dst.shutdown(socket.SHUT_WR)
            except OSError:
                pass

    def handle(client):
        try:
            upstream = socket.create_connection(TARGET, timeout=10)
        except OSError:
            client.close()
            return
        # The connect timeout must not stay on the socket. A generation can
        # sit silent for longer than that before the first token.
        upstream.settimeout(None)
        client.settimeout(None)
        threading.Thread(target=pipe, args=(client, upstream), daemon=True).start()
        threading.Thread(target=pipe, args=(upstream, client), daemon=True).start()

    server = socket.socket()
    server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    server.bind(LISTEN)
    server.listen()
    while True:
        conn, _ = server.accept()
        threading.Thread(target=handle, args=(conn,), daemon=True).start()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-bridge
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-bridge
  template:
    metadata:
      labels:
        app: ollama-bridge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: proxy
          image: python:3.12-slim
          command: ["python", "/proxy.py"]
          ports:
            - name: http
              containerPort: 11435
              hostPort: 11435
          volumeMounts:
            - name: proxy
              mountPath: /proxy.py
              subPath: proxy.py
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
      volumes:
        - name: proxy
          configMap:
            name: ollama-bridge
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-bridge
  namespace: ai
spec:
  selector:
    app: ollama-bridge
  ports:
    - name: http
      port: 11434
      targetPort: http
