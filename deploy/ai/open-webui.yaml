# Chat rows live in Postgres database openwebui on litellm-db.
# This directory only keeps the cache and uploads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.5
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: openai_api_key
            - name: WEBUI_URL
              value: https://chat.test
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: webui_secret_key
            - name: DEFAULT_MODELS
              value: local
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: database_url
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          hostPath:
            path: /Users/denis/.local-ai/open-webui
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: ai
  annotations:
    cert-manager.io/cluster-issuer: local-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - chat.test
      secretName: chat-test-tls
  rules:
    - host: chat.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
